name: Build Unison for GitHub Pages
description: Build the Unison submodule and copy it into a parent GitHub Pages artifact.

inputs:
  output-directory:
    description: Destination inside the parent Pages artifact, relative to GITHUB_WORKSPACE or absolute.
    required: true
  node-version:
    description: Node.js version used for the build.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Test and build for a Pages subdirectory
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm test
        npm run build:pages

    - name: Copy build into the parent artifact
      shell: bash
      env:
        UNISON_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        destination="$UNISON_OUTPUT_DIRECTORY"
        if [[ "$destination" != /* ]]; then
          destination="$GITHUB_WORKSPACE/$destination"
        fi
        mkdir -p "$destination"
        cp -a "$GITHUB_ACTION_PATH/dist/." "$destination/"
